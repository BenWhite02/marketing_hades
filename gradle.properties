# Gradle properties for Hades backend - Fixed for Java 17+
# Removed MaxPermSize which was deprecated in Java 8+

# JVM arguments (Java 17+ compatible)
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.prefs/java.util.prefs=ALL-UNNAMED

# Gradle performance settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# Kotlin configuration
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.native.ignoreDisabledTargets=true

# Spring Boot configuration
spring.profiles.active=dev

# Application properties
kairos.version=1.0.0-SNAPSHOT
