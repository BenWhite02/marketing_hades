# C:\03Marketing\Hades\src\main\resources\application.yml
# Application Configuration for Hades Backend

spring:
  application:
    name: hades
  
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/kairos_db
    username: ${DB_USERNAME:kairos_user}
    password: ${DB_PASSWORD:kairos_pass}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 8
        min-idle: 2
  
  security:
    user:
      name: user
      password: generated

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: always

# SpringDoc OpenAPI Configuration - FIXED for v2.3.0
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
    displayRequestDuration: true
    disable-swagger-default-url: false
    configUrl: /v3/api-docs/swagger-config
    url: /v3/api-docs
    csrf:
      enabled: false
  show-actuator: true
  use-fqn: true
  paths-to-match: /api/**, /actuator/**
  packages-to-scan: com.kairos.hades
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

logging:
  level:
    com.kairos.hades: DEBUG
    org.springframework.security: DEBUG
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.reactive: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true

# Kairos Application Configuration
kairos:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-jwt-secret-key-that-should-be-at-least-512-bits-long-for-development-only}
      expiration: ${JWT_EXPIRATION:3600}  # 1 hour in seconds
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400}  # 24 hours in seconds
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
  
  cache:
    default-ttl: PT15M
    decision-ttl: PT15M
    segment-ttl: PT1H
    user-session-ttl: PT24H
    app-context-ttl: PT8H
  
  apps:
    sandbox:
      auto-create: true
      max-customers: 1000
      max-campaigns: 10
      max-channels: 3
      data-retention-days: 30
    limits:
      max-apps-per-organization: 10
      max-users-per-app: 100

  # Application Info for Actuator
  application:
    name: Hades Backend
    description: Next-generation marketing platform backend
    version: 1.0.0
    
# Additional Spring Boot Configuration
info:
  app:
    name: Hades Backend
    description: Kairos Marketing Platform Backend API
    version: 1.0.0
    encoding: UTF-8
    java:
      version: 17